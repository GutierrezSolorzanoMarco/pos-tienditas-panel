<!DOCTYPE html>
<!--
  Panel de administración de Marco (generar código de activación + activar/
  suspender sucursal + contacto del dueño desde el teléfono, sin laptop).
  Ver pos-tienditas/supabase/functions/panel-api/index.ts para el backend.

  Historial de hosting de este archivo (por qué NO vive en Supabase):
  1. Edge Function propia (`supabase/functions/panel`, retirada) — Supabase
     fuerza Content-Type: text/plain + un CSP `sandbox` en cualquier
     respuesta HTML de una función, bloquea el <script> por completo.
  2. Bucket de Supabase Storage — mismo problema de CSP, confirmado con
     curl 24/08/2026.
  3. GitHub Pages — funcionaba, pero *.github.io no cargaba con datos
     móviles en la red de Marco (WiFi sí, datos no) — confirmado 26/08/2026,
     Supabase y el resto de internet sí respondían con datos.
  4. Railway (actual) — mismo patrón que pylonsystems.net y el bot de
     FacturaYa, ya probado que funciona en cualquier red. Servido por
     server.js (sin dependencias) en este mismo repo.

  Cómo volver a publicar un cambio:
    railway up --detach   (desde esta carpeta, con el CLI ya logueado)
-->

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Panel · POS Tienditas</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px; background: #F7F7F5; color: #111315;
    font-family: -apple-system, Roboto, system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  p.sub { color: #6B7280; font-size: 13px; margin: 0 0 20px; }
  .card {
    background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 16px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  input[type=text], input[type=password], input[type=tel] {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #E5E7EB;
    border-radius: 10px; margin-bottom: 10px; background: #F7F7F5; color: #111315;
  }
  input.chico { padding: 8px 10px; font-size: 13px; margin-bottom: 0; }
  button {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 600; border: none;
    border-radius: 10px; background: #178754; color: #FFFFFF; cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button.secundario { background: transparent; color: #6B7280; font-weight: 500; }
  .codigo-generado {
    text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 2px;
    padding: 18px; background: #F7F7F5; border-radius: 10px; margin: 12px 0; color: #178754;
    cursor: pointer;
  }
  .codigo-generado .toca { font-size: 12px; font-weight: 500; color: #6B7280; display: block; margin-top: 4px; letter-spacing: normal; }
  .fila-sucursal { padding: 10px 0; border-bottom: 1px solid #E5E7EB; }
  .fila-sucursal:last-child { border-bottom: none; }
  .fila-sucursal .encabezado { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .fila-sucursal .nombre { font-size: 15px; font-weight: 500; }
  .fila-sucursal .contacto { display: flex; gap: 8px; }
  .fila-sucursal .contacto input { flex: 1; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer; border: none;
    flex-shrink: 0; margin-left: 8px;
  }
  .badge.activo { background: #178754; color: #fff; }
  .badge.suspendido { background: #DC2626; color: #fff; }
  .fila-codigo { padding: 8px 0; border-bottom: 1px solid #E5E7EB; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fila-codigo:last-child { border-bottom: none; }
  .fila-codigo .info { min-width: 0; }
  .fila-codigo .codigo { font-weight: 700; font-size: 14px; cursor: pointer; }
  .fila-codigo .usado { color: #6B7280; }
  .fila-codigo .pendiente { color: #178754; }
  .fila-codigo .acciones { flex-shrink: 0; display: flex; gap: 10px; }
  .link-accion { font-size: 12px; font-weight: 600; color: #178754; background: none; border: none; padding: 0; width: auto; cursor: pointer; }
  .link-accion.borrar { color: #DC2626; }
  .error { color: #DC2626; font-size: 13px; margin: -4px 0 12px; }
  .vacio { color: #6B7280; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>

<div id="pantalla-login">
  <h1>Panel POS Tienditas</h1>
  <p class="sub">Escribe la contraseña de administrador (una sola vez, se guarda en este teléfono).</p>
  <div class="card">
    <input type="password" id="input-secreto" placeholder="Contraseña" autocomplete="off" />
    <div class="error" id="error-login" style="display:none"></div>
    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div id="pantalla-panel" style="display:none">
  <h1>Panel POS Tienditas</h1>
  <p class="sub">Códigos de activación y estado de sucursales.</p>

  <div class="card">
    <h2>Generar código para una tienda nueva</h2>
    <input type="text" id="input-nota" placeholder="Nombre de la tienda (opcional)" />
    <button onclick="generarCodigo()">Generar código nuevo</button>
    <div id="resultado-codigo"></div>
  </div>

  <div class="card">
    <h2>Sucursales</h2>
    <input type="text" id="buscar-sucursal" placeholder="Buscar por nombre o contacto…" oninput="pintarSucursales()" />
    <div id="lista-sucursales"><div class="vacio">Cargando…</div></div>
  </div>

  <div class="card">
    <h2>Últimos códigos generados</h2>
    <div id="lista-codigos"><div class="vacio">Cargando…</div></div>
  </div>

  <button class="secundario" onclick="cerrarSesion()">Olvidar contraseña en este teléfono</button>
</div>

<script>
  var CLAVE_SECRETO = 'pt_admin_secreto';
  // Absoluta y fija a propósito: esta página vive en Railway (otro dominio
  // que el de las Functions), así que no se puede derivar de location.href.
  var URL_API = 'https://ijntaernyflvqvvhvhkj.supabase.co/functions/v1/panel-api';

  // Cache local de lo último que llegó del servidor — pintarSucursales() la
  // vuelve a pintar filtrada cada vez que se escribe en el buscador, sin
  // pedirle nada de nuevo a la API.
  var ultimaListaSucursales = [];

  function secretoGuardado() { return localStorage.getItem(CLAVE_SECRETO); }

  async function llamar(accion, extra) {
    var body = Object.assign({ accion: accion, secreto: secretoGuardado() }, extra || {});
    var resp = await fetch(URL_API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.error || 'error_desconocido');
    return data;
  }

  async function entrar() {
    var secreto = document.getElementById('input-secreto').value.trim();
    var err = document.getElementById('error-login');
    err.style.display = 'none';
    if (!secreto) return;
    localStorage.setItem(CLAVE_SECRETO, secreto);
    try {
      await cargarTodo();
      document.getElementById('pantalla-login').style.display = 'none';
      document.getElementById('pantalla-panel').style.display = 'block';
    } catch (e) {
      localStorage.removeItem(CLAVE_SECRETO);
      err.textContent = 'Contraseña incorrecta.';
      err.style.display = 'block';
    }
  }

  function cerrarSesion() {
    localStorage.removeItem(CLAVE_SECRETO);
    location.reload();
  }

  // Copiar con un toque — con fallback por si el navegador no da
  // navigator.clipboard (ej. sitios sin https, aunque aquí siempre es https).
  function copiar(texto, elemento) {
    function marcarCopiado() {
      if (!elemento) return;
      var original = elemento.getAttribute('data-original') || elemento.textContent;
      elemento.setAttribute('data-original', original);
      elemento.textContent = '¡Copiado!';
      setTimeout(function () { elemento.textContent = elemento.getAttribute('data-original'); }, 900);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(marcarCopiado).catch(function () {});
    } else {
      var t = document.createElement('textarea');
      t.value = texto; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); marcarCopiado(); } catch (e) {}
      document.body.removeChild(t);
    }
  }

  async function generarCodigo() {
    var nota = document.getElementById('input-nota').value.trim();
    var cont = document.getElementById('resultado-codigo');
    cont.innerHTML = '<div class="vacio">Generando…</div>';
    try {
      var data = await llamar('generar_codigo', { nota: nota });
      cont.innerHTML = '<div class="codigo-generado" id="codigo-nuevo">' + data.codigo + '<span class="toca">Toca para copiar</span></div>';
      document.getElementById('codigo-nuevo').onclick = function () { copiar(data.codigo, this); };
      document.getElementById('input-nota').value = '';
      cargarTodo();
    } catch (e) {
      cont.innerHTML = '<div class="error">No se pudo generar. Intenta de nuevo.</div>';
    }
  }

  async function cambiarEstado(sucursalId, estadoActual) {
    var nuevo = estadoActual === 'activo' ? 'suspendido' : 'activo';
    if (!confirm(nuevo === 'suspendido' ? '¿Suspender esta sucursal?' : '¿Reactivar esta sucursal?')) return;
    try {
      await llamar('set_estado', { sucursalId: sucursalId, estado: nuevo });
      cargarTodo();
    } catch (e) {
      alert('No se pudo cambiar el estado. Intenta de nuevo.');
    }
  }

  // Se guarda solo al salir del campo (onblur) — nada de guardar en cada
  // tecla. Manda ambos campos juntos (el otro se lee del DOM) para no
  // pisar uno con un update parcial viejo si el usuario edita los dos
  // rápido.
  async function guardarContacto(sucursalId) {
    var nombre = document.getElementById('contacto-nombre-' + sucursalId).value;
    var telefono = document.getElementById('contacto-tel-' + sucursalId).value;
    try {
      await llamar('actualizar_contacto', { sucursalId: sucursalId, contactoNombre: nombre, contactoTelefono: telefono });
      var s = ultimaListaSucursales.find(function (x) { return x.id === sucursalId; });
      if (s) { s.contacto_nombre = nombre; s.contacto_telefono = telefono; }
    } catch (e) {
      alert('No se pudo guardar el contacto. Intenta de nuevo.');
    }
  }

  function pintarSucursales(sucursales) {
    if (sucursales) ultimaListaSucursales = sucursales;
    var cont = document.getElementById('lista-sucursales');
    var filtro = (document.getElementById('buscar-sucursal').value || '').trim().toLowerCase();
    var lista = ultimaListaSucursales.filter(function (s) {
      if (!filtro) return true;
      return (s.nombre || '').toLowerCase().indexOf(filtro) !== -1 ||
        (s.contacto_nombre || '').toLowerCase().indexOf(filtro) !== -1;
    });

    if (!ultimaListaSucursales.length) { cont.innerHTML = '<div class="vacio">Todavía no hay sucursales activadas.</div>'; return; }
    if (!lista.length) { cont.innerHTML = '<div class="vacio">Ninguna coincide con la búsqueda.</div>'; return; }

    cont.innerHTML = lista.map(function (s) {
      return '<div class="fila-sucursal">' +
        '<div class="encabezado"><span class="nombre">' + escapar(s.nombre) + '</span>' +
        '<button class="badge ' + s.estado_licencia + '" onclick="cambiarEstado(\'' + s.id + '\', \'' + s.estado_licencia + '\')">' +
        (s.estado_licencia === 'activo' ? 'Activo' : 'Suspendido') + '</button></div>' +
        '<div class="contacto">' +
        '<input type="text" class="chico" id="contacto-nombre-' + s.id + '" placeholder="Nombre del dueño" value="' + escapar(s.contacto_nombre || '') + '" onblur="guardarContacto(\'' + s.id + '\')" />' +
        '<input type="tel" class="chico" id="contacto-tel-' + s.id + '" placeholder="Teléfono" value="' + escapar(s.contacto_telefono || '') + '" onblur="guardarContacto(\'' + s.id + '\')" />' +
        '</div></div>';
    }).join('');
  }

  async function cancelarCodigo(codigoId) {
    if (!confirm('¿Cancelar este código? Ya no se va a poder usar.')) return;
    try {
      await llamar('cancelar_codigo', { codigoId: codigoId });
      cargarTodo();
    } catch (e) {
      alert('No se pudo cancelar — puede que ya se haya usado.');
    }
  }

  function pintarCodigos(codigos) {
    var cont = document.getElementById('lista-codigos');
    if (!codigos.length) { cont.innerHTML = '<div class="vacio">Todavía no hay códigos generados.</div>'; return; }
    cont.innerHTML = codigos.map(function (c) {
      var estado = c.usado ? '<span class="usado">usado</span>' : '<span class="pendiente">pendiente</span>';
      var nota = c.nota ? ' — ' + escapar(c.nota) : '';
      var acciones = '<button class="link-accion" onclick="copiar(\'' + c.codigo + '\', this)">Copiar</button>';
      if (!c.usado) acciones += '<button class="link-accion borrar" onclick="cancelarCodigo(\'' + c.id + '\')">Cancelar</button>';
      return '<div class="fila-codigo"><span class="info"><span class="codigo" onclick="copiar(\'' + c.codigo + '\', this)">' + c.codigo + '</span> ' + estado + nota + '</span>' +
        '<span class="acciones">' + acciones + '</span></div>';
    }).join('');
  }

  function escapar(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function cargarTodo() {
    var data = await llamar('listar');
    pintarSucursales(data.sucursales || []);
    pintarCodigos(data.codigos || []);
  }

  (function inicio() {
    if (secretoGuardado()) {
      cargarTodo().then(function () {
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('pantalla-panel').style.display = 'block';
      }).catch(function () {
        localStorage.removeItem(CLAVE_SECRETO);
      });
    }
  })();
</script>
</body>
</html>
